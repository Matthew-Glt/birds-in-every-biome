# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.3.0
group=com.mg3dp

# Dependencies
fabric_api_version=0.161.0+26.2

# Minecraft 26.x modding needs Java 25. This machine's user-level ~/.gradle/gradle.properties
# pins Gradle's build JVM to a JDK 17, and that cannot be overridden from here (the JVM is chosen
# before the project loads) - gradle/gradle-daemon-jvm.properties does it instead. Use build.ps1,
# or set JAVA_HOME to C:\Program Files\Microsoft\jdk-25.0.3.9-hotspot before calling gradlew.
