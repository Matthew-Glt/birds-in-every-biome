# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.3.0
group=com.mg3dp

# Dependencies
fabric_api_version=0.161.0+26.2

# Minecraft 26.x modding needs Java 25. If Gradle picks the wrong JDK (for example because a
# user-level ~/.gradle/gradle.properties pins another one), set JAVA_HOME to a JDK 25 install
# before calling gradlew - build.ps1 does that for you.
